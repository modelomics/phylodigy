[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phylodigy"
version = "0.2.0"
description = "Graph-derived phylogenetic trees over the shared Modelome database"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Phylodigy contributors"}]
dependencies = []

[project.optional-dependencies]
model = ["torch>=2.1"]
corpus = ["torch>=2.1", "transformers>=4.45", "huggingface-hub>=0.25"]
paper = ["pypdf>=4"]
columnar = ["pyarrow>=14", "cbor2>=5"]
dev = ["pytest>=8"]

[project.scripts]
phylodigy = "phylodigy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phylodigy = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
